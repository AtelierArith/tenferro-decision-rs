[package]
name = "jeff-infer"
description = "Jeff typed-decision engine (Qwen3.5 hybrid stack and trained readout)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
hub = ["dep:hf-fetch"]
# CUDA execution of the tenferro forward (`Device::Cuda`). Needs the CUDA
# driver at run time; tests touching hardware are `#[ignore]`d.
cuda = ["tenferro-ext/cuda", "tenferro-gated-delta/cuda", "tenferro-ad/cuda"]

[dependencies]
hf-fetch = { workspace = true, optional = true }
decision-core.workspace = true
cpu-kernels.workspace = true
serde_json.workspace = true
safetensors-io.workspace = true
rayon.workspace = true
tenferro-ad.workspace = true
tenferro-tensor.workspace = true
tenferro-infer.workspace = true
tenferro-cpu.workspace = true
tenferro-gated-delta = { path = "../tenferro-gated-delta" }
tenferro-ext.workspace = true
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
minijinja = { version = "2", features = ["json", "loader"] }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }

[dev-dependencies]
bench-suite = { path = "../bench-suite" }
hf-fetch.workspace = true

[[example]]
name = "bench_jeff_cuda"
required-features = ["cuda"]
