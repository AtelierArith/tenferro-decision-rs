[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AtelierArith/tenferro-decision-rs"
authors = ["Satoshi Terasaki <terasakisatoshi.math@gmail.com> and contributors"]

[workspace.dependencies]
# Local crates.
decision-core = { path = "crates/decision-core" }
tenferro-infer = { path = "crates/tenferro-infer" }
tenferro-ext = { path = "crates/tenferro-ext" }
reference-data = { path = "crates/reference-data" }
safetensors-io = { path = "crates/safetensors-io" }
hf-fetch = { path = "crates/hf-fetch" }
cpu-kernels = { path = "crates/cpu-kernels" }

# Shared third-party dependencies.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
criterion = "0.5"
# Laya tokenizer helpers (Hugging Face `tokenizer.json` subset).
regex = "1"
unicode-normalization = "0.1"
# Portable, hand-tuned f32 GEMM for the host (non-tenferro) CPU kernels.
matrixmultiply = "0.3"
# Runtime-dispatched portable SIMD (used by the Gated DeltaNet host scan).
pulp = "0.22"
rayon = "1"
# `jev-client`'s optional concrete HTTP/TLS transport. `rustls-tls` avoids
# native OpenSSL; `blocking` matches the crate's synchronous transport trait.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "blocking"] }

# Pinned to the surveyed tenferro-rs revision (`11_TENFERRO_API_SURVEY.md`).
# The crates.io 0.7.1 release predates this revision and differs in the
# session-entry API (`with_backend_session` returns a nested `Result` here).
# The MVP engine path uses the CPU provider only.
tenferro-runtime = { git = "https://github.com/tensor4all/tenferro-rs", rev = "471c4278dbc5a955b8a1664789c37e5d07e743cb" }
tenferro-cpu = { git = "https://github.com/tensor4all/tenferro-rs", rev = "471c4278dbc5a955b8a1664789c37e5d07e743cb" }
tenferro-tensor = { git = "https://github.com/tensor4all/tenferro-rs", rev = "471c4278dbc5a955b8a1664789c37e5d07e743cb" }
tenferro-ad = { git = "https://github.com/tensor4all/tenferro-rs", rev = "471c4278dbc5a955b8a1664789c37e5d07e743cb" }
tenferro-linalg = { git = "https://github.com/tensor4all/tenferro-rs", rev = "471c4278dbc5a955b8a1664789c37e5d07e743cb" }
