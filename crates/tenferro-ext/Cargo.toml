[package]
name = "tenferro-ext"
description = "Self-hosted tenferro extension ops for the decision engines (erf, exact GELU, CPU GEMM)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
onednn = ["cpu-kernels/onednn"]
cuda = ["dep:tenferro-gpu", "dep:cudarc", "dep:rayon", "dep:cubecl", "cubecl/std", "cubecl/stdlib", "cubecl/cuda", "dep:cubecl-cuda", "tenferro-ad/cuda"]

[dependencies]
tenferro-ad.workspace = true
tenferro-runtime.workspace = true
tenferro-tensor.workspace = true
tenferro-cpu.workspace = true
cpu-kernels.workspace = true
tenferro-infer.workspace = true
tenferro-gpu = { workspace = true, optional = true, features = ["cuda"] }
cudarc = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
cubecl = { workspace = true, optional = true }
cubecl-cuda = { workspace = true, optional = true }
