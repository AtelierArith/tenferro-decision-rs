name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Many large test binaries link against tenferro; full debuginfo and
  # incremental data exhaust the runner's disk and lld dies with a Bus error.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # tenferro-rs requires Rust 1.96+.

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: test (serde feature)
        run: cargo test -p decision-core --features serde
