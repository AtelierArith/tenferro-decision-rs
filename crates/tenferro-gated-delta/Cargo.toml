[package]
name = "tenferro-gated-delta"
description = "Chunked and recurrent Gated DeltaNet for the Jeff engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
cuda = ["dep:tenferro-gpu", "tenferro-ad/cuda", "tenferro-linalg/cuda"]

[dependencies]
decision-core.workspace = true
cpu-kernels.workspace = true
pulp = { workspace = true, features = ["x86-v4"] }
rayon.workspace = true
tenferro-ad.workspace = true
tenferro-runtime.workspace = true
tenferro-linalg = { workspace = true, features = ["autodiff"] }
tenferro-tensor.workspace = true
tenferro-cpu.workspace = true
tenferro-gpu = { workspace = true, optional = true, features = ["cuda"] }
tenferro-infer.workspace = true

[dev-dependencies]
