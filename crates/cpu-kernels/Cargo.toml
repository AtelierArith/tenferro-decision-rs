[package]
name = "cpu-kernels"
description = "Host CPU kernels (BLAS-class matmul, SIMD helpers) shared by the engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Optional system oneDNN provider; portable kernels remain available.
onednn = ["dep:cc"]
# Links the system LP64 OpenBLAS library for wide Laya projection GEMMs.
openblas = []

[dependencies]
matrixmultiply.workspace = true
rayon.workspace = true

[build-dependencies]
cc = { version = "1.6", optional = true }
